name: Outage schedule monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: outages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run outages monitor
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          REVIEW_CHAT_ID: ${{ secrets.REVIEW_CHAT_ID }}
          MODE: ${{ vars.OUTAGES_MODE || 'review' }}
          TARGET_CHANNEL: "@rozdilnianskahromada"
        run: python outages.py
      - name: Save state
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state_outages.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update outages state"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
